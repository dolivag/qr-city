name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Caché de Nx entre ejecuciones: solo se rehace lo que cambia.
      - name: Restaurar caché de Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      - name: Lint
        run: npx nx run-many -t lint

      - name: Comprobar tipos
        run: npx nx run-many -t typecheck

      - name: Tests
        run: npx nx run-many -t test

      - name: Build
        run: npx nx run-many -t build

  # Que el código QR se lea de verdad: renderiza la vista cenital en Chromium (WebGL por software)
  # y la decodifica con jsQR, para cada estilo y varios textos.
  escaneo:
    name: Escaneabilidad del QR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas de escaneo
        run: npx nx run e2e:e2e

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-escaneo
          path: e2e/playwright-report
          retention-days: 7
