<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EFEBE2" />
    <title>Ciudad QR</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header class="head">
        <h1>Ciudad <em>QR</em></h1>
        <p class="lede">Una ciudad cuyos tejados forman un código QR. Desde arriba, se puede escanear.</p>
      </header>

      <section class="stage" aria-label="Ciudad 3D">
        <qr-city
          id="city"
          intro="door"
          pause-at-threshold
          data="https://github.com/dolivag/qr-city"
          door-label="Abrir la puerta"
          label="Ciudad 3D cuyos tejados forman un código QR"
        ></qr-city>

        <p class="hint" id="hint">Toca la puerta para entrar</p>
        <button type="button" class="skip" id="skip" hidden>Saltar animación</button>

        <div class="gate" id="gate" hidden>
          <form class="card" id="form" autocomplete="off" novalidate>
            <h2>¿Qué ciudad <em>construimos</em>?</h2>
            <p>Pega un enlace o un texto. Los tejados de la ciudad formarán su código QR.</p>
            <label for="data">Enlace o texto</label>
            <input id="data" type="text" value="https://github.com/dolivag/qr-city" maxlength="300" spellcheck="false" />
            <p class="err" id="err" role="alert"></p>
            <div class="row">
              <button type="submit" class="primary">Construir ciudad</button>
              <button type="button" id="cancel" hidden>Cancelar</button>
            </div>
          </form>
        </div>
      </section>

      <div class="panel">
        <button type="button" id="toggle" disabled>Revelar QR</button>
        <button type="button" id="again" disabled>Otra ciudad</button>
        <button type="button" id="png" disabled>Descargar PNG</button>
        <p id="msg" role="status"></p>
      </div>

      <footer class="foot">
        <span>@qr-city/element</span>
        <span>three.js</span>
        <a href="https://github.com/dolivag/qr-city">GitHub</a>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
